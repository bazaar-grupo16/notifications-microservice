# ──────────────────────────────────────────────────────────────
# Kubernetes Service — Bazaar PostgreSQL Database
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: notifications-db
  labels:
    app: notifications-db
spec:
  type: ClusterIP
  selector:
    app: notifications-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
