# ──────────────────────────────────────────────────────────────
# Kubernetes Deployment — Bazaar Microservice
# ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  labels:
    app: notifications-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
      labels:
        app: notifications-service
    spec:
      imagePullSecrets:
        - name: ghcr-login-secret
      containers:
        - name: notifications-service
          image: $IMAGE_NAME:$IMAGE_TAG
          ports:
            - containerPort: 8000
          # ── Environment from Kubernetes Secret ──────
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: notifications-db-credentials
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: notifications-db-credentials
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: notifications-db-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notifications-db-credentials
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: notifications-db-credentials
                  key: DB_NAME
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_SERVICE_NAME
              value: notifications-service
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=dev,k8s.cluster.name=bazaar-dev"
            - name: OTEL_PROPAGATORS
              value: "tracecontext,baggage"
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          # ── Resources ──────────────────────────────
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
